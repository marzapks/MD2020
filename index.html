<title>MD 2020 — hands-free musical directions solution</title>
<style>

b{font-weight:700}
/* ---- home ---- */
#home{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 16px;background:radial-gradient(ellipse at 50% 38%,rgba(var(--ui-rgb),.13),transparent 62%),#000;overflow:hidden}

.logo{position:relative;font-family:"Orbitron","Eurostile","Arial Black",system-ui,sans-serif;font-weight:900;font-size:clamp(64px,19vw,170px);letter-spacing:.04em;line-height:.95;color:var(--ui);text-shadow:0 0 8px var(--ui),0 0 24px var(--ui),0 0 64px rgba(var(--ui-rgb),.6);display:flex;gap:.14em;align-items:baseline;justify-content:center}

#launch{position:relative;margin-top:18px;padding:16px 54px;font-size:22px;letter-spacing:.35em;font-weight:800;background:transparent;border:2px solid var(--ui);color:var(--ui);border-radius:4px;text-shadow:0 0 10px var(--ui);box-shadow:0 0 18px rgba(var(--ui-rgb),.5),inset 0 0 18px rgba(var(--ui-rgb),.25);animation:glow 2.4s ease-in-out infinite}

#homeGuide{position:absolute;top:max(12px,env(safe-area-inset-top));right:12px;width:44px;height:44px;border-radius:50%;border:2px solid var(--ui);background:#000;color:var(--ui);font-size:22px;font-weight:800;box-shadow:0 0 14px rgba(var(--ui-rgb),.6)}

#app{position:fixed;inset:0;display:flex;flex-direction:column;background:#000;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

.chordw{display:flex;align-items:baseline;justify-content:center;font-weight:900;color:var(--cc,#fff);text-shadow:0 0 .18em var(--cc,#fff),0 0 .6em var(--cc,#fff);line-height:1;white-space:nowrap;position:relative}

.bassw{display:flex;align-items:baseline;gap:10px;color:var(--cc,#fff)}.bassw i{font-style:normal;font-size:clamp(11px,2.4vmin,18px);letter-spacing:.25em;color:var(--dim)}.bassw b{font-size:calc(clamp(30px,9vmin,80px)*var(--sc));text-shadow:0 0 14px var(--cc,#fff)}
.nextw{display:flex;align-items:baseline;gap:12px;color:var(--cc,#fff);padding:4px 16px;border:2px solid transparent;border-radius:10px}
.nextw i{font-style:normal;font-size:clamp(11px,2.6vmin,20px);letter-spacing:.25em;color:var(--dim)}.nextw b{font-size:calc(clamp(28px,8vmin,72px)*var(--sc));text-shadow:0 0 14px var(--cc,#fff)}.nextw span{font-size:clamp(12px,2.6vmin,20px);color:var(--dim);letter-spacing:.08em}
.nextw.warn{border-color:var(--cc);animation:wr .25s infinite alternate}@keyframes wr{to{background:rgba(255,255,255,.14)}}
.cdw{width:min(92%,900px);display:flex;align-items:center;gap:14px}
.cdbar{flex:1;height:calc(clamp(14px,3.4vmin,28px)*var(--sc));border:2px solid var(--ui);border-radius:99px;overflow:hidden;background:rgba(var(--ui-rgb),.08)}

.beats{display:flex;gap:calc(1.6vmin);justify-content:center;flex-wrap:wrap}
.beats i{width:calc(clamp(22px,7vmin,60px)*var(--sc));height:calc(clamp(22px,7vmin,60px)*var(--sc));border-radius:50%;border:3px solid var(--ln);transition:background .05s}
.beats i.dn{border-color:var(--ui)}.beats i.on{background:var(--ui);box-shadow:0 0 22px var(--ui);border-color:var(--ui)}.beats i.on.cnt{background:#ffb020;border-color:#ffb020;box-shadow:0 0 22px #ffb020}
.subs{display:flex;gap:4px;justify-content:center;flex-wrap:wrap}.subs i{width:calc(clamp(10px,3vmin,26px)*var(--sc));height:calc(clamp(10px,3vmin,26px)*var(--sc));border-radius:3px;border:2px solid var(--ln)}.subs i.bt{border-color:var(--ui)}.subs i.on{background:var(--ui);box-shadow:0 0 12px var(--ui)}

.mini{position:relative;display:flex;width:min(92%,900px);height:12px;border-radius:6px;overflow:hidden;opacity:.85}.mini i{display:block;opacity:.55;border-right:2px solid #000}.mini em{position:absolute;top:-2px;bottom:-2px;width:4px;background:#fff;box-shadow:0 0 8px #fff;transform:translateX(-2px)}

.folbar{flex:none;display:flex;gap:10px;align-items:center;padding:8px;border-top:1px solid var(--ln);color:var(--dim);font-size:13px}body.fs .folbar{display:none}
#auto{position:fixed;left:8px;right:8px;top:62px;z-index:60;display:none;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;background:#120c00;border:2px solid #ffb020;border-radius:10px;color:#ffb020;font-weight:800}#auto.on{display:flex}

/* ---- modal ---- */
#layer{position:fixed;inset:0;z-index:100;pointer-events:none}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;padding:10px;pointer-events:auto}
.sheet{width:min(560px,100%);max-height:92vh;display:flex;flex-direction:column;background:#050a0a;border:2px solid var(--ui);border-radius:14px;box-shadow:0 0 30px rgba(var(--ui-rgb),.4)}
.sheet.wide{width:min(760px,100%)}

select,.txt,.num,textarea{background:#000;color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:9px 8px;font:inherit;font-size:15px;min-height:40px;max-width:100%}
.txt{flex:1;min-width:140px;width:100%}.num{width:76px}textarea.code{width:100%;font-family:ui-monospace,monospace;font-size:11px;word-break:break-all;margin:6px 0}

.sw{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.swb{width:38px;height:38px;border-radius:50%;border:3px solid #000}.swb.on{outline:3px solid #fff}

kbd.k.t{color:#59ffc8}kbd.k.r{color:#ff3b5c}kbd.k.m{color:#59ffc8}kbd.k.a{color:#ffb020}kbd.k.b{color:#4da6ff}kbd.k.e{color:#ff4dd8}
.jgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}.jgrid.three{grid-template-columns:repeat(3,1fr)}

/* ---------- util ---------- */

const clone=o=>JSON.parse(JSON.stringify(o));

const wait=ms=>new Promise(r=>setTimeout(r,ms));
function h(tag,a,...kids){

const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

function b64(ab){const u=new Uint8Array(ab);let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s);}

function hexRgb(hex){const m=/^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(hex||'');return m?[parseInt(m[1],16),parseInt(m[2],16),parseInt(m[3],16)]:[0,255,213];}

/* ---------- music constants ---------- */
const PCL={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
const SHP=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const FLT=['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];

const normAcc=s=>(s||'').replace('♯','#').replace('♭','b');

function nameOf(pc,fl){return (fl?FLT:SHP)[((pc%12)+12)%12];}
function prefFlats(root,minor){const r=nameOf(pcOf(root),true);return minor?['D','G','C','F','Bb','Eb'].includes(r):['F','Bb','Eb','Ab','Db','Gb'].includes(r);}
const _pc={};
function parseChord(s){s=s||'';if(_pc[s]!==undefined)return _pc[s];const m=/^([A-G])([#b♯♭]?)([^\/]*)(?:\/([A-G][#b♯♭]?))?$/.exec(s.trim());return _pc[s]=m?{root:m[1]+normAcc(m[2]),letter:m[1],q:m[3],bass:m[4]?normAcc(m[4]):null}:null;}
const pretty=r=>r?r[0]+(r[1]?(r[1]==='#'?'♯':'♭'):''):'';
function tSym(s,semi,fl){const c=parseChord(s);if(!c)return s;return nameOf(pcOf(c.root)+semi,fl)+c.q+(c.bass?'/'+nameOf(pcOf(c.bass)+semi,fl):'');}
const QUAL=[['','Major'],['m','Minor'],['7','7'],['maj7','Maj 7'],['m7','Min 7'],['sus4','Sus 4'],['sus2','Sus 2'],['6','6'],['m6','Min 6'],['9','9'],['m9','Min 9'],['maj9','Maj 9'],['add9','Add 9'],['5','Power 5'],['dim','Dim'],['dim7','Dim 7'],['m7b5','Half-dim'],['aug','Aug'],['7sus4','7sus4'],['11','11'],['13','13']];
const QSAY={'':'',m:'minor',7:'seven',maj7:'major seven',m7:'minor seven',sus4:'sus four',sus:'sus',sus2:'sus two',6:'six',m6:'minor six',9:'nine',m9:'minor nine',maj9:'major nine',add9:'add nine',5:'five',dim:'dim',dim7:'dim seven',m7b5:'minor seven flat five',aug:'aug','7sus4':'seven sus four',11:'eleven',13:'thirteen',min:'minor',maj:'',M7:'major seven',min7:'minor seven'};

const NUMW=['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve'];
function normSay(t){return String(t||'').toLowerCase().replace(/(\d+)/g,(m,d)=>' '+(NUMW[+d]||d)+' ').replace(/[^a-z ]/g,' ').replace(/\s+/g,' ').trim();}

/* ---------- section types, cues, templates ---------- */
const STYPES={
 intro:{n:'Intro',bars:4,dyn:'mp',c:'#4dd0ff',say:'intro'},verse:{n:'Verse',bars:8,dyn:'mf',c:'#7dff6a',say:'verse'},
 pre:{n:'Pre-Chorus',bars:4,dyn:'mf',c:'#ffe14d',say:'pre chorus'},chorus:{n:'Chorus',bars:8,dyn:'f',c:'#ff4dd8',say:'chorus'},
 post:{n:'Post-Chorus',bars:4,dyn:'f',c:'#ff7ad9',say:'post chorus'},bridge:{n:'Bridge',bars:8,dyn:'mf',c:'#ff9a2e',say:'bridge'},
 solo:{n:'Solo',bars:8,dyn:'f',c:'#ff5a5a',say:'solo'},inter:{n:'Interlude',bars:4,dyn:'mp',c:'#9fb4ff',say:'interlude'},
 brk:{n:'Breakdown',bars:4,dyn:'pp',c:'#8a8aff',say:'breakdown'},build:{n:'Build',bars:4,dyn:'mf',c:'#ffd34d',say:'build'},
 key:{n:'Key Change',bars:2,dyn:'mf',c:'#b36bff',say:'key change'},vamp:{n:'Vamp',bars:4,dyn:'mf',c:'#59ffc8',say:'vamp'},
 tag:{n:'Tag',bars:2,dyn:'f',c:'#ff8a8a',say:'tag'},outro:{n:'Outro',bars:4,dyn:'mp',c:'#4dd0ff',say:'outro'},

const CUES=[
 {k:'d2',label:'DRUMS ON 2',say:'drums on two',b:1,count:true,at:'pre'},{k:'d3',label:'DRUMS ON 3',say:'drums on three',b:2,count:true,at:'pre'},
 {k:'din',label:'DRUMS IN',say:'drums in',b:0,at:'pre'},{k:'bin',label:'BASS IN',say:'bass in',b:0,at:'pre'},{k:'kin',label:'KEYS IN',say:'keys in',b:0,at:'pre'},
 {k:'gin',label:'GUITARS IN',say:'guitars in',b:0,at:'pre'},{k:'vin',label:'VOCALS IN',say:'vocals in',b:0,at:'pre'},{k:'all',label:'EVERYONE IN',say:'everyone in',b:0,at:'pre'},
 {k:'dout',label:'DRUMS OUT',say:'drums out',b:0,at:'pre'},{k:'bout',label:'BASS OUT',say:'bass out',b:0,at:'pre'},
 {k:'hit',label:'HIT',say:'hit',b:0,at:'on'},{k:'stop',label:'STOP',say:'stop',b:0,at:'on'},{k:'hold',label:'HOLD',say:'hold',b:0,at:'pre'},
 {k:'build',label:'BUILD',say:'build',b:0,at:'pre'},{k:'brk',label:'BREAKDOWN',say:'breakdown',b:0,at:'pre'},
 {k:'half',label:'HALF TIME',say:'half time',b:0,at:'pre'},{k:'dbl',label:'DOUBLE TIME',say:'double time',b:0,at:'pre'},
 {k:'dn',label:'TAKE IT DOWN',say:'take it down',b:0,at:'pre'},{k:'up',label:'TAKE IT UP',say:'take it up',b:0,at:'pre'},
 {k:'last',label:'LAST TIME',say:'last time',b:0,at:'pre'},{k:'more',label:'ONE MORE TIME',say:'one more time',b:0,at:'pre'},
 {k:'big',label:'BIG ENDING',say:'big ending',b:0,at:'pre'},{k:'ready',label:'READY',say:'ready',b:0,at:'pre'},{k:'go',label:'GO',say:'go',b:0,at:'on'},{k:'cut',label:'CUT',say:'cut',b:0,at:'on'}];
const PROGS={
 maj:[['I – V – vi – IV (pop axis)','I V vi IV'],['vi – IV – I – V','vi IV I V'],['I – vi – IV – V (50s)','I vi IV V'],['I – IV – V – I','I IV V I'],['I – IV – vi – V','I IV vi V'],
  ['I – V – vi – iii – IV – I – IV – V (canon)','I V vi iii IV I IV V'],['I – bVII – IV – I (rock)','I bVII IV I'],['ii – V – I – I','ii V I I'],['I – IV (vamp)','I IV'],['I – IV – I – V','I IV I V'],

 min:[['i – bVI – bIII – bVII','i bVI bIII bVII'],['i – bVII – bVI – V','i bVII bVI V'],['i – iv – bVII – bIII','i iv bVII bIII'],['i – bIII – bVII – iv','i bIII bVII iv'],['i – bVI – iv – V','i bVI iv V'],['i – iv – v – i','i iv v i'],['i – bVII (vamp)','i bVII']]};
const TYPEPROG={maj:{intro:'I V vi IV',verse:'vi IV I V',pre:'IV V vi V',chorus:'I V vi IV',post:'I V',bridge:'vi V IV I',solo:'I V vi IV',inter:'I IV',brk:'vi IV',build:'IV V',key:'I',vamp:'I IV',tag:'I IV I',outro:'I V vi IV',end:'IV V I I',custom:'I V vi IV'},
 min:{intro:'i bVI bIII bVII',verse:'i bVII bVI bVII',pre:'iv bVI bVII bVII',chorus:'bVI bVII i i',post:'i bVII',bridge:'iv bVI bVII i',solo:'i bVII bVI bVII',inter:'i bVII',brk:'i bVI',build:'iv bVII',key:'i',vamp:'i bVII',tag:'i bVII i',outro:'i bVI bIII bVII',end:'iv bVII i i',custom:'i bVII bVI bVII'}};
const STRUCTS={pop:{n:'Pop / Radio',s:['intro','verse','pre','chorus','verse','pre','chorus','bridge','chorus','outro']},worship:{n:'Worship',s:['intro','verse','chorus','verse','chorus','bridge','chorus','chorus','end']},
 rock:{n:'Rock',s:['intro','verse','chorus','verse','chorus','solo','chorus','outro']},blues:{n:'12-Bar Blues',s:['intro','verse','verse','solo','verse','end']},short:{n:'Verse / Chorus',s:['verse','chorus']},blank:{n:'Blank (1 section)',s:['verse']}};
const ROM={I:0,II:2,III:4,IV:5,V:7,VI:9,VII:11};
function romanToChord(tok,keyPc,fl){const m=/^([b#]?)(VII|VI|IV|V|III|II|I|vii|vi|iv|v|iii|ii|i)(.*)$/.exec(tok);if(!m)return null;let off=ROM[m[2].toUpperCase()];if(m[1]==='b')off--;if(m[1]==='#')off++;const minor=m[2]===m[2].toLowerCase();return nameOf(keyPc+off,fl)+(minor?'m':'')+(m[3]||'').replace('°','dim');}
const DYN={pp:.3,p:.45,mp:.62,mf:.8,f:1,ff:1.15};

/* ---------- song model ---------- */
const newBar=()=>({ch:[],cues:[],bpm:null,ramp:null,dyn:null});
function newSection(type,name,bars,ts){const T=STYPES[type]||STYPES.custom;return{id:uid(),type,name:name||T.n,ts:ts||null,bars:Array.from({length:bars||T.bars},()=>newBar())};}
function newSong(name){return{id:uid(),name:name||'Untitled Song',key:'C',minor:false,bpm:120,ts:[4,4],countIn:1,sections:[newSection('verse'),newSection('chorus')],audio:null,marks:[],region:null,notes:''};}
function fillSection(song,sec,tokens,keyRoot,minor,per){
  const fl=prefFlats(keyRoot,minor),kp=pcOf(keyRoot);const ch=tokens.map(t=>romanToChord(t,kp,fl)||t);if(!ch.length)return;
  const n=(sec.ts||song.ts)[0];let ci=0;sec.bars.forEach((b,i)=>{b.ch=[];
    if(per===2){b.ch.push({b:0,s:ch[ci++%ch.length],c:null},{b:Math.floor(n/2),s:ch[ci++%ch.length],c:null});}
    else if(per===0.5){if(i%2===0)b.ch.push({b:0,s:ch[ci++%ch.length],c:null});}
    else b.ch.push({b:0,s:ch[ci++%ch.length],c:null});});}
function rampSection(sec,a,z){const N=sec.bars.length;sec.bars.forEach((b,i)=>{b.bpm=Math.round(a+(z-a)*i/N);b.ramp=Math.round(a+(z-a)*(i+1)/N);});}

  const s=newSong(o.name);s.key=o.key||'C';s.minor=!!o.minor;s.bpm=o.bpm||120;s.ts=o.ts||[4,4];
  const st=STRUCTS[o.struct||'pop'];const types=st.s;const cnt={};types.forEach(t=>cnt[t]=(cnt[t]||0)+1);const seen={};
  const blues=o.struct==='blues';
  s.sections=types.map(t=>{seen[t]=(seen[t]||0)+1;const nm=STYPES[t].n+(cnt[t]>1?' '+seen[t]:'');const len=blues&&(t==='verse'||t==='solo')?12:STYPES[t].bars;const sec=newSection(t,nm,len,null);
    const toks=blues&&(t==='verse'||t==='solo')?PROGS.maj[11][1]:TYPEPROG[s.minor?'min':'maj'][t];fillSection(s,sec,toks.split(' '),s.key,s.minor,1);return sec;});

  const s=buildSong({name:'Demo — Neon Nights',key:'G',bpm:96,struct:'pop'});
  const sc=(i)=>s.sections[i];
  sc(1).bars[0].cues.push({id:uid(),b:1,say:'drums on two',label:'DRUMS ON 2',count:true,at:'pre'});
  sc(3).bars[0].cues.push({id:uid(),b:0,say:'everyone in',label:'EVERYONE IN',count:false,at:'pre'});
  rampSection(sc(7),96,106);sc(8).bars[0].bpm=96;rampSection(sc(9),96,80);
  sc(2).bars[2].ch.push({b:2,s:'D',c:null});

/* ---------- layout (flat bars + chord resolution) ---------- */
const pulse=(bpm,den)=>60/bpm*4/den;
const bpmAt=(bar,k)=>bar.b0+(bar.b1-bar.b0)*k/bar.n;
function lay(song){
  if(song._l)return song._l;
  const bars=[],secStart=[],cs=[];let bpm=song.bpm,t=0,sb=0,cur=null;
  song.sections.forEach((sec,si)=>{secStart.push(bars.length);const ts=sec.ts||song.ts;
    sec.bars.forEach((b,bi)=>{if(b.bpm)bpm=b.bpm;const b0=bpm,b1=b.ramp||bpm,n=ts[0],den=ts[1];let d=0;for(let k=0;k<n;k++)d+=pulse(b0+(b1-b0)*k/n,den);
      const row=[];for(let k=0;k<n;k++){const e=b.ch.filter(x=>x.b===k).pop();if(e)cur=e;row.push(cur);}
      bars.push({si,bi,gi:bars.length,n,den,b0,b1,sb,t0:t,dur:d});cs.push(row);sb+=n;t+=d;if(b.ramp)bpm=b.ramp;});});

function refGi(song,ref){if(!ref)return -1;const si=song.sections.findIndex(s=>s.id===ref.sid);if(si<0)return -1;const L=lay(song);return L.secStart[si]+clamp(ref.bi,0,song.sections[si].bars.length-1);}
function giRef(song,gi){const b=lay(song).bars[gi];return{sid:song.sections[b.si].id,bi:b.bi};}
const sameChord=(a,b)=>a===b||(!!a&&!!b&&a.s===b.s&&(a.c||'')===(b.c||''));
function colorOf(ev){if(!ev)return '#fff';if(ev.c)return ev.c;const c=parseChord(ev.s);if(!c)return '#fff';if(CFG.colorMode==='pitch')return 'hsl('+(pcOf(c.root)*30)+',100%,60%)';return CFG.pal[c.letter]||'#fff';}
function dynOf(sec,bar){return DYN[bar.dyn||STYPES[sec.type]?.dyn||'mf']||.8;}

  const s=curSong(),L=lay(s),w=h('div',{class:'tl'});const ppb=UI.zoom,H=Math.ceil(L.totalBeats*ppb)+40;
  w.append(h('div',{class:'tlbar'},h('span',null,'Drag chords & cues to move them · tap empty lane to add · tap an item to edit'),h('span',{class:'sp'}),btn('−',()=>{UI.zoom=Math.max(6,Math.round(UI.zoom*.75));renderBody();},'sm'),btn('＋',()=>{UI.zoom=Math.min(80,Math.round(UI.zoom*1.35));renderBody();},'sm'),btn('▶ Play from here',()=>{const g=UI.tlSel!=null?UI.tlSel:E.startGi;E.startGi=g;E.resumeGi=g;setMode('play');setTimeout(()=>startSong({gi:g}),50);},'on sm')));
  const sc=h('div',{class:'tlscroll'}),cv=h('div',{class:'tlcv',style:{width:H+'px'}});sc.append(cv);
  const lane=(name,cls)=>{const l=h('div',{class:'lane '+cls},h('em',null,name));cv.append(l);return l;};
  const ruler=lane('','ruler'),secl=lane('SECTIONS','secl'),tmp=lane('TEMPO','tmpl'),dyn=lane('DYNAMICS','dynl'),chl=lane('CHORDS','chl'),cul=lane('CUES','cul'),aul=a_lane(s,lane,L,ppb);
  const X=gb=>gb*ppb+8;
  L.bars.forEach((b,i)=>{const x=X(b.sb);ruler.append(h('i',{class:'rb',style:{left:x+'px'}},ppb>=14||i%4===0?String(i+1):''));if(ppb>=24)for(let k=1;k<b.n;k++)ruler.append(h('i',{class:'rt',style:{left:X(b.sb+k)+'px'}}));});
  s.sections.forEach((sec,si)=>{const g=L.secStart[si],b0=L.bars[g];secl.append(h('div',{class:'blk',style:{left:X(b0.sb)+'px',width:Math.max(4,sec.bars.reduce((a,_,i)=>a+L.bars[g+i].n,0)*ppb-2)+'px','--c':(STYPES[sec.type]||{}).c||'#fff'},onclick:()=>{UI.selSec=si;UI.selBar=0;UI.tlSel=g;toast(sec.name+' selected');}},sec.name));
    sec.bars.forEach((bar,bi)=>{const gb=L.bars[g+bi];if(bar.bpm||bar.ramp||(g+bi>0&&gb.b0!==L.bars[g+bi-1].b1))tmp.append(h('div',{class:'tp',style:{left:X(gb.sb)+'px'}},Math.round(gb.b0)+(gb.b1!==gb.b0?'→'+Math.round(gb.b1):'')));
      const dv=dynOf(sec,bar);dyn.append(h('i',{class:'dy',style:{left:X(gb.sb)+'px',width:gb.n*ppb+'px',height:Math.round(dv/1.15*100)+'%',opacity:.3+dv*.5}}));
      bar.ch.forEach(ev=>chl.append(tlItem(s,L,ppb,'ch',ev,bar,gb,ev.b,chordLabel(ev),colorOf(ev))));
      bar.cues.forEach(c=>cul.append(tlItem(s,L,ppb,'cue',c,bar,gb,c.b,c.label||c.say,'#ffb020')));});});
  const addAt=(laneEl,kind)=>laneEl.addEventListener('click',e=>{if(e.target!==laneEl&&!e.target.classList.contains('lane'))return;const r=laneEl.getBoundingClientRect(),gb=Math.floor((e.clientX-r.left-8)/ppb);if(gb<0||gb>=L.totalBeats)return;const bar=barAtBeat(L,gb);if(!bar)return;const k=gb-bar.sb,sec=s.sections[bar.si],bb=sec.bars[bar.bi];
    UI.tlSel=bar.gi;if(kind==='ch'){const prev=(L.cs[bar.gi][k])?L.cs[bar.gi][k].s:s.key;bb.ch=bb.ch.filter(x=>x.b!==k);bb.ch.push({b:k,s:prev,c:null});changed();UI.selSec=bar.si;UI.selBar=bar.bi;toast('Chord added — edit it in ARRANGE or tap it');}
    else{promptCue(bb,k,()=>changed());}});
  addAt(chl,'ch');addAt(cul,'cue');
  /* audio start marker click */
  const ph=h('i',{class:'phd'});cv.append(ph);UI.tlPh=ph;UI.tlPpb=ppb;
  w.append(sc);w.append(h('p',{class:'hint'},'Bars are numbered along the top. Tempo changes and dynamics show above the chords. Tap a section block to select it.'));
  const upd=()=>{if(!ph.isConnected)return;requestAnimationFrame(upd);if(E.on||E.paused){const b=L.bars[clamp(E.dispG,0,L.bars.length-1)],k=DS.p?DS.p.k:0;ph.style.left=X(b.sb+k)+'px';ph.style.display='block';}else if(UI.tlSel!=null&&L.bars[UI.tlSel]){ph.style.left=X(L.bars[UI.tlSel].sb)+'px';ph.style.display='block';}else ph.style.display='none';};
  setTimeout(upd,50);return w;}
function a_lane(s,lane,L,ppb){const l=lane('AUDIO','aul');const a=s.audio;if(a&&AUD[s.id]&&AUD[s.id].buf&&!a.loop){const buf=AUD[s.id].buf,sb=clamp(a.startBar||0,0,L.bars.length-1),x0=L.bars[sb].sb*ppb+8,w=Math.max(10,Math.min(L.dur-L.bars[sb].t0,buf.duration)/L.dur*L.totalBeats*ppb);const cv=h('canvas',{class:'tw',style:{left:x0+'px',width:w+'px'},height:36,width:Math.floor(w)});const c=cv.getContext('2d'),d=buf.getChannelData(0),step=Math.max(1,Math.floor(d.length/cv.width));c.fillStyle='#ff4dd8';for(let x=0;x<cv.width;x++){let m=0;for(let i=0;i<step;i+=Math.ceil(step/30)){const v=Math.abs(d[x*step+i]||0);if(v>m)m=v;}c.fillRect(x,18-m*17,1,Math.max(1,m*34));}l.append(cv);}else if(a){l.append(h('i',{class:'note'},a.loop?'↻ looping '+a.name:a.name));}return l;}
function barAtBeat(L,gb){for(const b of L.bars)if(gb>=b.sb&&gb<b.sb+b.n)return b;return null;}
function promptCue(bar,k,done){let m;const body=h('div',{class:'jgrid'},CUES.slice(0,12).map(d=>h('button',{class:'jb',onclick:()=>{bar.cues.push({id:uid(),b:k,say:d.say,label:d.label,count:false,at:d.at==='on'?'on':'pre'});m.close();done();}},h('b',null,d.label))));
  m=modal('Add cue at beat '+(k+1),body);}
function tlItem(s,L,ppb,kind,ev,bar,gb,k,label,color){
  const el=h('div',{class:'it '+kind,style:{left:(gb.sb+k)*ppb+8+'px','--c':color}},label);
  let sx=0,drag=false,dx=0;
  el.addEventListener('pointerdown',e=>{e.stopPropagation();el.setPointerCapture(e.pointerId);sx=e.clientX;drag=false;dx=0;});
  el.addEventListener('pointermove',e=>{if(!el.hasPointerCapture||!el.hasPointerCapture(e.pointerId))return;dx=e.clientX-sx;if(Math.abs(dx)>5)drag=true;if(drag)el.style.transform='translateX('+dx+'px)';});
  el.addEventListener('pointerup',e=>{el.style.transform='';if(drag){const target=gb.sb+k+Math.round(dx/ppb);const tb=barAtBeat(L,clamp(target,0,L.totalBeats-1));if(tb){const tsec=s.sections[tb.si],tbar=tsec.bars[tb.bi],tk=clamp(target,0,L.totalBeats-1)-tb.sb;
      if(kind==='ch'){bar.ch=bar.ch.filter(x=>x!==ev);tbar.ch=tbar.ch.filter(x=>x.b!==tk);ev.b=tk;tbar.ch.push(ev);}else{bar.cues=bar.cues.filter(x=>x!==ev);ev.b=tk;tbar.cues.push(ev);}changed();}}
    else{UI.selSec=gb.si;UI.selBar=gb.bi;UI.tlSel=gb.gi;if(kind==='ch'){UI.selCh=bar.ch.slice().sort((a,b)=>a.b-b.b).indexOf(ev);itemMenu(s,ev,bar,kind);}else itemMenu(s,ev,bar,kind);}});
  return el;}
function itemMenu(s,ev,bar,kind){let m;const body=h('div',null);
  if(kind==='ch'){const c=parseChord(ev.s)||{root:'C',q:'',bass:null};const rl=c.root[0],ac=c.root[1]||'';const set=(r,a,q,bs)=>{ev.s=r+a+q+(bs?'/'+bs:'');changed();};
    body.append(row('Chord',sel(['C','D','E','F','G','A','B'],rl,v=>set(v,ac,c.q,c.bass)),sel([['','♮'],['b','♭'],['#','♯']],ac,v=>set(rl,v,c.q,c.bass)),sel(QUAL.map(q=>[q[0],q[1]]),QUAL.some(q=>q[0]===c.q)?c.q:'',v=>set(rl,ac,v,c.bass))),
      row('Bass',sel([['','—']].concat(SHP.map((x,i)=>[x,x+(FLT[i]!==x?' / '+FLT[i]:'')])),c.bass?SHP[pcOf(c.bass)]:'',v=>set(rl,ac,c.q,v||null))),btn('Delete chord',()=>{bar.ch=bar.ch.filter(x=>x!==ev);changed();m.close();},'red'));}
  else body.append(h('p',{class:'msg'},ev.label||ev.say),row('Beat',sel(Array.from({length:lay(s).bars[giOf(s,bar)].n},(_,i)=>[i,String(i+1)]),ev.b,v=>{ev.b=+v;changed();})),sel([['pre','Spoken before the bar'],['on','Spoken on the beat']],ev.at,v=>{ev.at=v;changed();}),chk('Count in',ev.count,v=>{ev.count=v;changed();}),btn('Delete cue',()=>{bar.cues=bar.cues.filter(x=>x!==ev);changed();m.close();},'red'));
  m=modal(kind==='ch'?'EDIT CHORD':'EDIT CUE',body);}
function giOf(s,bar){const L=lay(s);for(let i=0;i<s.sections.length;i++){const j=s.sections[i].bars.indexOf(bar);if(j>=0)return L.secStart[i]+j;}return 0;}

/* ================= INPUT ================= */
let lastPlayKey=0;
function doAction(id){
  switch(id){
   case'play':if(E.on&&CFG.safe){const n=performance.now();if(n-lastPlayKey>700){lastPlayKey=n;toast('Press again to PAUSE',700);return;}}lastPlayKey=0;togglePlay();break;
   case'panic':panic();break;
   case'stop':if((E.on||E.paused)&&CFG.safe){const n=performance.now();if(n-lastPlayKey>700){lastPlayKey=n;toast('Press again to STOP',700);return;}}lastPlayKey=0;stopSong();break;
   case'mute':toggleMute();break;case'hold':toggleFlag('hold');break;case'loop':toggleFlag('loop');break;case'restart':restartSec();break;case'jump':openJump();break;case'end':openEnd();break;
   case'next':selectSong(SET.cur+1);break;case'prev':selectSong(SET.cur-1);break;case'nsec':stepSec(1);break;case'psec':stepSec(-1);break;case'fs':toggleFS();break;
   case'mode':setMode(UI.mode==='edit'?'play':'edit');break;case'set':openSet();break;case'settings':openSettings();break;case'guide':openGuide();break;}}
function editKey(e){
  const s=curSong(),sec=curSec(),bar=curBar();let ch=null;const k=e.key;
  const ev=()=>{const arr=bar.ch.slice().sort((a,b)=>a.b-b.b);if(!arr.length){const ne={b:0,s:'C',c:null};bar.ch.push(ne);return ne;}return arr[clamp(UI.selCh,0,arr.length-1)];};
  if(k==='ArrowRight'){if(UI.selBar<sec.bars.length-1)UI.selBar++;else if(UI.selSec<s.sections.length-1){UI.selSec++;UI.selBar=0;}UI.selCh=0;renderBody();return true;}
  if(k==='ArrowLeft'){if(UI.selBar>0)UI.selBar--;else if(UI.selSec>0){UI.selSec--;UI.selBar=curSec().bars.length-1;}UI.selCh=0;renderBody();return true;}
  if(k==='ArrowDown'){if(UI.selSec<s.sections.length-1){UI.selSec++;UI.selBar=0;renderBody();}return true;}
  if(k==='ArrowUp'){if(UI.selSec>0){UI.selSec--;UI.selBar=0;renderBody();}return true;}
  if(k==='Delete'||k==='Backspace'){bar.ch=[];changed();return true;}
  if(/^[a-gA-G]$/.test(k)&&!e.ctrlKey&&!e.metaKey){const x=ev(),c=parseChord(x.s)||{q:'',bass:null};x.s=k.toUpperCase()+(c.q||'');changed();return true;}
  if(k==='#'||k==='-'||k==='m'||k==='M'||k==='7'||k==='j'||k==='J'||k==='s'||k==='S'||k==='0'){const x=ev(),c=parseChord(x.s);if(!c)return true;
    if(k==='#')x.s=c.letter+(c.root[1]==='#'?'':'#')+c.q;else if(k==='-')x.s=c.letter+(c.root[1]==='b'?'':'b')+c.q;
    else if(k==='m'||k==='M')x.s=c.root+(c.q.startsWith('m')&&!c.q.startsWith('maj')?c.q.slice(1):'m'+c.q);
    else if(k==='7')x.s=c.root+(c.q==='7'?'':c.q.startsWith('m')?'m7':'7');else if(k==='j'||k==='J')x.s=c.root+'maj7';else if(k==='s'||k==='S')x.s=c.root+'sus4';else x.s=c.root;
    if(c.bass)x.s+='/'+c.bass;changed();return true;}
  if(k==='Enter'){UI.selCh=0;renderBody();return true;}return false;}
document.addEventListener('keydown',e=>{
  const tg=e.target,typing=tg&&(tg.tagName==='INPUT'&&!['checkbox','range','color','button'].includes(tg.type)||tg.tagName==='TEXTAREA'||tg.tagName==='SELECT');
  if(UI.learn){e.preventDefault();if(e.code==='Escape'){UI.learn=null;}else{CFG.keys[UI.learn]=e.code;UI.learn=null;saveSoon();}const m=MODALS.find(x=>x.syncRefresh);if(m){const t=m.body.querySelector('.tabs button.on');if(t)t.click();}return;}
  if(e.key==='Escape'){if(MODALS.length){MODALS[MODALS.length-1].close();e.preventDefault();return;}if(document.body.classList.contains('fs')){exitFS();return;}}
  const top=MODALS[MODALS.length-1];if(top){if(typing)return;if(top.keys&&top.keys(e)){e.preventDefault();return;}if(e.key==='Enter'&&!e.target.closest('button')){}return;}
  if(typing)return;if($('#app').classList.contains('hidden'))return;
  if(e.ctrlKey||e.metaKey){if(e.code==='KeyS'){e.preventDefault();saveSongFile(false);}return;}
  if(UI.mode==='edit'&&UI.tab==='arrange'&&!E.on){if(editKey(e)){e.preventDefault();return;}}
  const act=ACTIONS.find(a=>CFG.keys[a[0]]===e.code);if(act){e.preventDefault();if(e.repeat&&act[0]!=='panic')return;if(isFollower()&&!['fs','settings','guide'].includes(act[0]))return;doAction(act[0]);}});
/* ================= BOOT ================= */
let launched=false;
function launch(){$('#home').classList.add('hidden');$('#app').classList.remove('hidden');initAudio();if(A.ctx.state==='suspended')A.ctx.resume();syncSong();renderApp();if(!launched){launched=true;setTimeout(()=>prepareVoices(curSong()),300);requestAnimationFrame(frame);}}
function boot(){
  applyUI();syncSong();
  $('#launch').onclick=launch;$('#homeGuide').onclick=()=>openGuide();$('#fsExit').onclick=exitFS;
  window.addEventListener('beforeunload',e=>{if(E.on){e.preventDefault();e.returnValue='';}});
  if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
  try{if(window.speechSynthesis)speechSynthesis.getVoices();}catch(e){}
  requestAnimationFrame(frame);}
boot();

</script>
